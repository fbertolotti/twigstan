name: Composer Lock Diff
on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true
permissions:
    pull-requests: write
    contents: read
jobs:
    composer-lock-diff:
        if: github.event.sender.login == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'dependencies')
        name: Composer Lock Diff
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   name: Checkout
                uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
                with:
                    ref: ${{ github.event.pull_request.head.sha }}
                    fetch-depth: 0
            -   name: Comment composer.lock diff
                uses: WyriHaximus/github-action-composer.lock-diff@af833768d62a18c535006320cc0bc2e349a80e62 # v2.1.0
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
